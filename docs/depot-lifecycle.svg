<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#fff"/><text x="20" y="30" font-size="16" font-weight="700" fill="#16243a">Depot lifecycle — provisioning lifecycle × selection</text><text x="20" y="64" font-size="16" font-weight="700" fill="#16243a">1 · Provisioning lifecycle of a single depot</text><g><rect x="20" y="92" rx="9" width="210" height="64" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/><text x="125" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">Uninitialized</text><text x="125" y="132" text-anchor="middle" font-size="11" fill="#3a4a63">no depot.json</text><text x="125" y="147" text-anchor="middle" font-size="11" fill="#3a4a63">doctor: initialized=false</text></g><g><rect x="360" y="92" rx="9" width="210" height="64" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/><text x="465" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">Initialized</text><text x="465" y="132" text-anchor="middle" font-size="11" fill="#3a4a63">depot.json marker</text></g><g><rect x="700" y="92" rx="9" width="210" height="64" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/><text x="805" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">Populated</text><text x="805" y="132" text-anchor="middle" font-size="11" fill="#3a4a63">bundles + catalog</text></g><line x1="230" y1="124" x2="360" y2="124" stroke="#334" stroke-width="1.6" marker-end="url(#arr)"/><text x="295" y="114" text-anchor="middle" font-size="11.5" fill="#334">aha depot init</text><line x1="570" y1="124" x2="700" y2="124" stroke="#334" stroke-width="1.6" marker-end="url(#arr)"/><text x="635" y="114" text-anchor="middle" font-size="11.5" fill="#334">snapshot / refresh</text><path d="M410,92 C430,52 500,52 520,92" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#arr)"/><text x="465" y="48" text-anchor="middle" font-size="11.5" fill="#334">init (idempotent)</text><path d="M760,92 C780,52 850,52 870,92" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#arr)"/><text x="815" y="48" text-anchor="middle" font-size="11.5" fill="#334">snapshot · ls · verify · compact</text><path d="M125,156 C360,215 620,215 805,156" fill="none" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#arr)"/><text x="465" y="212" text-anchor="middle" font-size="11.5" fill="#1f7a4d">first snapshot / refresh → auto-init + populate</text><g><rect x="700" y="300" rx="9" width="210" height="64" fill="#fbeeee" stroke="#33507a" stroke-width="1.5"/><text x="805" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">Degraded</text><text x="805" y="340" text-anchor="middle" font-size="11" fill="#3a4a63">marker missing /</text><text x="805" y="355" text-anchor="middle" font-size="11" fill="#3a4a63">catalog drift</text></g><g><rect x="360" y="300" rx="9" width="210" height="64" fill="#f0eef6" stroke="#33507a" stroke-width="1.5"/><text x="465" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">Decommissioned</text><text x="465" y="340" text-anchor="middle" font-size="11" fill="#3a4a63">rm dir / delete bucket</text><text x="465" y="355" text-anchor="middle" font-size="11" fill="#3a4a63">(external — not aha)</text></g><line x1="745" y1="156" x2="745" y2="300" stroke="#9a3030" stroke-width="1.6" marker-end="url(#arr)"/><text x="705" y="228" text-anchor="end" font-size="11" fill="#9a3030">damage</text><line x1="865" y1="300" x2="865" y2="156" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#arr)"/><text x="905" y="228" text-anchor="start" font-size="11" fill="#1f7a4d">verify --repair</text><line x1="465" y1="156" x2="465" y2="300" stroke="#6b5b95" stroke-width="1.6" marker-end="url(#arr)"/><text x="478" y="232" text-anchor="start" font-size="11" fill="#6b5b95">external delete</text><text x="465" y="382" text-anchor="middle" font-size="11" fill="#667">then behaves as Uninitialized again</text><text x="20" y="440" font-size="16" font-weight="700" fill="#16243a">2 · Selection — which initialized depot is the default (a config pointer)</text><g><rect x="40" y="470" rx="9" width="220" height="58" fill="#eef7ee" stroke="#33507a" stroke-width="1.5"/><text x="150" y="492" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">config default</text><text x="150" y="510" text-anchor="middle" font-size="11" fill="#3a4a63">depot.type / location</text></g><g><rect x="610" y="430" rx="9" width="180" height="58" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/><text x="700" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">local depot</text><text x="700" y="470" text-anchor="middle" font-size="11" fill="#3a4a63">~/.aha/depot</text></g><g><rect x="610" y="514" rx="9" width="180" height="58" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/><text x="700" y="536" text-anchor="middle" font-size="15" font-weight="700" fill="#16243a">r2 depot</text><text x="700" y="554" text-anchor="middle" font-size="11" fill="#3a4a63">aha-depot</text></g><line x1="260" y1="491" x2="610" y2="459" stroke="#334" stroke-width="1.6" marker-end="url(#arr)"/><line x1="260" y1="507" x2="610" y2="543" stroke="#334" stroke-width="1.6" marker-end="url(#arr)"/><text x="435" y="468" text-anchor="middle" font-size="11.5" fill="#334">aha depot init &lt;addr&gt;  /  aha depot use &lt;addr&gt; move the pointer</text><text x="40" y="562" text-anchor="start" font-size="11.5" fill="#9a3030">--depot &lt;addr&gt; = one-off override; runs against &lt;addr&gt; but never moves the pointer (may still auto-init it)</text><text x="40" y="582" text-anchor="start" font-size="11" fill="#667">Only an Initialized depot may be selected; depot use refuses an uninitialized target.</text></svg>