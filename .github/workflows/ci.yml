name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            scripts/mcp-conformance/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/mcp-conformance/requirements.txt
      - run: npm ci --prefix clients/typescript
      # Dependencies for the Python and TypeScript MCP conformance legs.
      # verify.sh never installs anything itself.
      - run: npm ci --prefix scripts/mcp-conformance
      - run: python -m pip install -r scripts/mcp-conformance/requirements.txt
      - run: scripts/verify.sh ci
        env:
          # Every MCP conformance leg must run: a missing toolchain fails the
          # build instead of skipping with exit 0.
          AHA_MCP_REQUIRE_ALL_LEGS: "1"
