name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./internal/adapters -run=^$ -fuzz=FuzzParseGenericJSONL -fuzztime=2s
      - run: go build -o /tmp/aha ./cmd/aha
      - run: git diff --check
