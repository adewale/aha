name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            scripts/mcp-conformance/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/mcp-conformance/requirements.txt
      - run: npm ci --prefix clients/typescript
      # Dependencies for the Python and TypeScript MCP conformance legs.
      # verify.sh never installs anything itself.
      - run: npm ci --prefix scripts/mcp-conformance
      - run: python -m pip install -r scripts/mcp-conformance/requirements.txt
      - run: scripts/verify.sh ci
        env:
          # Every MCP conformance leg must run: a missing toolchain fails the
          # build instead of skipping with exit 0.
          AHA_MCP_REQUIRE_ALL_LEGS: "1"
